# Base training config — composes model, optimizer, and data via defaults groups.
# Run with: python train.py --config base
# Override with: python train.py --config base -o model=large optimizer.lr=0.001

defaults:
  - model: base       # loads conf/model/base.yaml → merged under "model"
  - optimizer: adamw  # loads conf/optimizer/adamw.yaml → merged under "optimizer"
  - data: imagenet    # loads conf/data/imagenet.yaml → merged under "data"
  - _self_            # put this config's own values last (they override groups)

# Top-level experiment settings
exp_name: default
seed: 42
max_steps: 10000
eval_every: 500

# List[dataclass] — override individual elements via CLI:
#   python train.py model.layers.0.dim=1024 model.layers.1.type=mlp
model:
  layers:
    - type: attention
      dim: 256
      heads: 8
      dropout: 0.0
    - type: mlp
      dim: 512
      heads: 1
      dropout: 0.0

  # Dict[str, dataclass] — override by key via CLI:
  #   python train.py model.heads.attention.dim=512 model.heads.mlp.ratio=8
  heads:
    attention:
      dim: 128
      ratio: 4
    mlp:
      dim: 256
      ratio: 8

# WandB (optional)
wandb_project: null
wandb_entity: null
